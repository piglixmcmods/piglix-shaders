<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Piglix Vibrant Visuals Shader Builder for Minecraft Bedrock">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Piglix Shader Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Piglix Shader Builder</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #080D14;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #080D14;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px;
      border-radius: 20px;
      background: rgba(14, 23, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .splash-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
    }
    .splash-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .splash-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #22C55E;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }
    .splash-bar {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .splash-bar-inner {
      height: 100%;
      background: #22C55E;
      border-radius: 3px;
      position: absolute;
      animation: splash-anim 1.4s infinite ease-in-out;
      box-shadow: 0 0 8px #22C55E;
    }
    @keyframes splash-anim {
      0% { left: -30%; width: 30%; }
      50% { left: 35%; width: 45%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-card">
      <div class="splash-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
      <div class="splash-title">PIGLIX SHADER BUILDER</div>
      <div class="splash-subtitle">VIBRANT VISUALS ENGINE</div>
      <div class="splash-bar">
        <div class="splash-bar-inner"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 400);
      }
    });
    // Fallback cleanup if event is not dispatched
    setTimeout(function() {
      var splash = document.getElementById('loading-splash');
      if (splash && document.querySelector('flutter-view')) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 400);
      }
    }, 3500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
